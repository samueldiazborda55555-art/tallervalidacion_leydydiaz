<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <h2>FORMULARIO DE EMPLEADOS</h2>

        <form id="empleform">

            <label>nombre:</label><br>
            <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre">
            <div id="errornombre" class="error"></div>

            <label>Cargo:</label><br>
            <input type="text" id="cargo" name="cargo" placeholder="Ingrese su cargo">
            <div id="errorcargo" class="error"></div>

            <label>Salario:</label><br>
            <input type="number" id="salario" name="salario" placeholder="Ingrese su salario">
            <div id="errorsalario" class="error"></div>

            <label>Horas extra:</label><br>
            <input type="number" id="horas" name="horas" placeholder="Ingrese las horas extra">
            <div id="errorhoras" class="error"></div>

            <button type="submit">Registrar</button>
        </form>
        <div id="mensaje"></div>
    </div>
    <script src="ejercicio4.js"></script>
</body>
</html>

</body>
