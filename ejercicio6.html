<!DOCTYPE html>
    <head>
        <meta charset="UTF-8">
         <title>Ejercicio 6</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="contenedor">
            <h2>CAMBIO DE CONTRASEÑA</h2>

            <form id="formularioContraseña">
                <label>Contraseña actual:</label><br>
                <input type="password" id ="Contraseñaactual" name="Contraseñaactual" placeholder="Ingrese contraseña actual">
                <div id="errorcontraseñaactual" class="error"></div>

                <label>Nueva contraseña:</label><br>
                <input type="password" id ="Nuevacontraseña" name="Nuevacontraseña" placeholder="Ingrese nueva contraseña">
                <div id="errornuevacontraseña" class="error"></div>

                <label>Confirmar contraseña:</label><br>
                <input type="password" id ="Confirmarcontraseña" name="Confirmarcontraseña" placeholder="Confirme nueva contraseña">
                <div id="errorconfirmarcontraseña" class="error"></div>

                <button type="submit">Cambiar contraseña</button>
            </form>
            
            <div id="mensaje"></div>
                
        </div>

        <script src="ejercicio6.js"></script>
    </body>
</html>
